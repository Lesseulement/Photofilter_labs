<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PHOTOCORE | Digital Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-image-1">
    <nav class="navbar">
        <div class="nav-container">
            <a href="#" class="logo" onclick="showSection('home')">
                PHOTO<span class="accent">CORE</span>
            </a>

            <div class="nav-menu">
                <a href="#" id="link-goal" onclick="showSection('goal')">Цель</a>
                <a href="#" id="link-calc" onclick="showSection('calc')">Калькулятор</a>
                <a href="#" id="link-author" onclick="showSection('author')">Автор</a>
            </div>

            <div class="nav-actions">
                <button class="action-btn theme-toggle" onclick="toggleTheme()">
                    <span>🌓</span> Фон
                </button>
                <a href="https://github.com/" target="_blank" class="action-btn github-btn">
                    <img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt=""> GitHub
                </a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="home" class="tab-content">
            <div class="pixlr-card">
                <h2>Творческая лаборатория</h2>
                <p>Добро пожаловать в PHOTOCORE. Теперь верстка стабильна и ничего не съезжает.</p>
            </div>
        </div>

        <div id="goal" class="tab-content" style="display: none;">
            <div class="pixlr-card">
                <h2>Цель работы</h2>
                <p>Разработка адаптивного интерфейса с использованием современных Flexbox-контейнеров.</p>
            </div>
        </div>

        <div id="calc" class="tab-content" style="display: none;">
            <div class="pixlr-editor-frame">
                <div id="result" class="display">0</div>
                <div class="grid">
                    <button class="btn-ps" style="color:#ff453a; grid-column: span 2;" id="btn_op_clear">C</button>
                    <button class="btn-ps" style="color:#00a8ff" id="btn_op_backspace">⌫</button>
                    <button class="btn-ps" style="color:#00a8ff" id="btn_op_div">/</button>

                    <button class="btn-ps" id="btn_digit_7">7</button>
                    <button class="btn-ps" id="btn_digit_8">8</button>
                    <button class="btn-ps" id="btn_digit_9">9</button>
                    <button class="btn-ps" style="color:#00a8ff" id="btn_op_mult">x</button>

                    <button class="btn-ps" id="btn_digit_4">4</button>
                    <button class="btn-ps" id="btn_digit_5">5</button>
                    <button class="btn-ps" id="btn_digit_6">6</button>
                    <button class="btn-ps" style="color:#00a8ff" id="btn_op_minus">-</button>

                    <button class="btn-ps" id="btn_digit_1">1</button>
                    <button class="btn-ps" id="btn_digit_2">2</button>
                    <button class="btn-ps" id="btn_digit_3">3</button>
                    <button class="btn-ps" style="color:#00a8ff" id="btn_op_plus">+</button>

                    <button class="btn-ps" id="btn_op_sign">+/-</button>
                    <button class="btn-ps" id="btn_digit_0">0</button>
                    <button class="btn-ps" id="btn_digit_000">000</button>
                    <button class="btn-ps equal-btn" id="btn_op_equal">=</button>

                    <button class="btn-ps" style="color:#00a8ff" id="btn_op_sqrt">√</button>
                    <button class="btn-ps" style="color:#00a8ff; grid-column: span 3;" id="btn_op_sqr">x²</button>
                </div>
            </div>
        </div>

        <div id="author" class="tab-content" style="display: none;">
            <div class="pixlr-card">
                <h2>Автор</h2>
                <p>Твое Имя<br>Группа ХХ-ХХ</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
